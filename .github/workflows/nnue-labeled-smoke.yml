name: nnue-labeled-smoke

on:
  workflow_dispatch:
    inputs:
      positions:
        description: "Maximum labeled positions"
        required: true
        default: "1000"
      games:
        description: "Maximum self-play games"
        required: true
        default: "100"
      nodes:
        description: "Fixed UCI nodes per move"
        required: true
        default: "4096"
      opening_random_plies:
        description: "Deterministic random opening plies"
        required: true
        default: "6"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install data tooling
        run: python -m pip install --disable-pip-version-check python-chess

      - name: Compile active portable Magic engine
        run: |
          g++ -O2 -std=c++17 -pthread engine_build11_bitboard.cpp -o engine_build11_magic
          sha256sum engine_build11.cpp engine_build11_bitboard.cpp engine_build11_magic

      - name: Generate deterministic opening pool
        run: |
          python tools/make_opening_pool.py \
            --out opening_pool_smoke.txt \
            --count 2000 \
            --seed 0x20261008 \
            --min-plies 8 \
            --max-plies 12
          sha256sum opening_pool_smoke.txt

      - name: Generate labeled smoke shard
        run: |
          python tools/labeled_selfplay.py \
            --engine ./engine_build11_magic \
            --out-dir out \
            --opening-book opening_pool_smoke.txt \
            --shard-id smoke-${{ github.run_number }} \
            --positions "${{ inputs.positions }}" \
            --games "${{ inputs.games }}" \
            --nodes "${{ inputs.nodes }}" \
            --opening-random-plies "${{ inputs.opening_random_plies }}" \
            --sample-every 1 \
            --min-ply 10 \
            --max-plies 180 \
            --threads 1 \
            --hash 32

      - name: Validate labeled shard
        run: |
          DATA=$(find out -name '*.jsonl.gz' -print -quit)
          MANIFEST=$(find out -name 'manifest_*.json' -print -quit)
          python tools/validate_labeled.py --data "$DATA" --manifest "$MANIFEST"
          cat "$MANIFEST"

      - name: Upload labeled smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: nnue-labeled-smoke-${{ github.run_number }}
          path: |
            out/
            opening_pool_smoke.txt
          retention-days: 14
