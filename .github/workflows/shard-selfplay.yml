name: shard-selfplay

on:
  workflow_dispatch:
    inputs:
      shard_id:
        description: "Shard identifier"
        required: true
        default: "0001"
      positions:
        description: "Number of unique balanced FEN positions"
        required: true
        default: "50000"
      games:
        description: "Maximum self-play games"
        required: true
        default: "1200"
      nodes:
        description: "Fixed UCI nodes per engine move"
        required: true
        default: "10000"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install chess parser
        run: python -m pip install --disable-pip-version-check python-chess

      - name: Compile build1.1
        run: g++ -O2 -std=c++17 -pthread engine_build11.cpp -o engine_build11

      - name: Generate balanced self-play shard
        run: |
          python tools/selfplay_positions.py \
            --engine ./engine_build11 \
            --out positions_shard_${{ inputs.shard_id }}.fen \
            --positions "${{ inputs.positions }}" \
            --games "${{ inputs.games }}" \
            --nodes "${{ inputs.nodes }}" \
            --sample-every 2 \
            --opening-random-plies 6 \
            --min-ply 10 \
            --max-plies 180 \
            --threads 1 \
            --hash 32

      - name: Check shard
        run: |
          test -s positions_shard_${{ inputs.shard_id }}.fen
          wc -l positions_shard_${{ inputs.shard_id }}.fen
          awk '{ if ($2=="w") w++; else if ($2=="b") b++ } END { print "white_to_move=" w; print "black_to_move=" b }' positions_shard_${{ inputs.shard_id }}.fen
          sha256sum positions_shard_${{ inputs.shard_id }}.fen

      - name: Upload shard artifact
        uses: actions/upload-artifact@v4
        with:
          name: selfplay-shard-${{ inputs.shard_id }}
          path: positions_shard_${{ inputs.shard_id }}.fen
          retention-days: 14
