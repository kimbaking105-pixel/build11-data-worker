name: test-selfplay

on:
  workflow_dispatch:
    inputs:
      positions:
        description: "Number of unique FEN positions"
        required: true
        default: "1000"
      movetime:
        description: "Engine milliseconds per move"
        required: true
        default: "5"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install chess parser
        run: python -m pip install --disable-pip-version-check python-chess

      - name: Compile build1.1
        run: g++ -O2 -std=c++17 -pthread engine_build11.cpp -o engine_build11

      - name: Run 1000-position smoke self-play
        run: |
          python tools/selfplay_positions.py \
            --engine ./engine_build11 \
            --out positions.fen \
            --positions "${{ inputs.positions }}" \
            --games 100 \
            --movetime "${{ inputs.movetime }}" \
            --sample-every 2 \
            --min-ply 10 \
            --max-plies 180 \
            --threads 1 \
            --hash 32

      - name: Check output
        run: |
          test -s positions.fen
          wc -l positions.fen
          sha256sum positions.fen
          head -n 3 positions.fen

      - name: Upload positions artifact
        uses: actions/upload-artifact@v4
        with:
          name: selfplay-test-${{ github.run_number }}
          path: positions.fen
          retention-days: 7
